<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#002FA7">
  <!-- Защита: страница может грузить скрипты только свои и Telegram, картинки и шрифты — только свои -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Инфо ПТК — твой гид по Политеху</title>
  <link rel="icon" href="img/novsu-blue.svg">
  <link rel="preload" href="fonts/ptsans-400-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=202611010126">
</head>
<body>
  <div class="app">
    <!-- Главные экраны (вкладки) -->
    <main id="screens">
      <!-- Появляется, когда раздел открыт по ссылке (например, «Где поесть» с главной) -->
      <header class="detail-bar jump-bar" id="jumpBar" hidden>
        <button class="back" id="jumpBack">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          Назад
        </button>
      </header>
      <section class="screen" id="view-home"></section>
      <section class="screen" id="view-safety" hidden></section>
      <section class="screen" id="view-rules" hidden></section>
      <section class="screen" id="view-people" hidden></section>
      <section class="screen" id="view-nearby" hidden></section>
    </main>

    <!-- Экран подробностей: открывается поверх вкладки -->
    <section class="detail" id="detail" hidden>
      <header class="detail-bar">
        <button class="back" id="backBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          Назад
        </button>
      </header>
      <div class="detail-body" id="detailBody"></div>
    </section>

    <nav class="tabs" role="tablist" aria-label="Разделы">
      <button role="tab" data-view="home" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5.5v-6h-5v6H4z"/></svg>
        <span>Главная</span>
      </button>
      <button role="tab" data-view="safety" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6L12 3z"/></svg>
        <span>Безопасность</span>
      </button>
      <button role="tab" data-view="rules" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.3 5 7.8 4.5 4 4.5v13c3.8 0 6.3.5 8 2 1.7-1.5 4.2-2 8-2v-13c-3.8 0-6.3.5-8 2z"/><path d="M12 6.5v13"/></svg>
        <span>Студенту</span>
      </button>
      <button role="tab" data-view="people" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c.8-3.9 3.9-6 7.5-6s6.7 2.1 7.5 6"/></svg>
        <span>Педагоги</span>
      </button>
      <button role="tab" data-view="nearby" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
        <span>Рядом</span>
      </button>
    </nav>
  </div>

  <script src="data.js?v=202611010126"></script>
  <script src="app.js?v=202611010126"></script>
</body>
</html>
